name: Backend Checks

# Lint and typecheck. Runs on PRs, and is called by "Backend: Deploy" as the gate
# in front of the image build.
#
# There is no `push: main` trigger any more: on main this is called by
# Backend Deploy instead, so keeping one would run the same checks twice on the
# same commit.
#
# The pull_request trigger is deliberately not path-filtered. A required status
# check that never triggers sits pending forever rather than passing, so a filter
# here would block every PR that does not touch the backend.
on:
  pull_request:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # corepack activates the pnpm pinned by `packageManager`, same as the API
      # image. `npm install -g pnpm` fetched latest and then delegated to the
      # pin anyway — two downloads, and an unpinned one in the build path.
      - name: Install pnpm
        run: corepack enable

      # --filter, or the shared lockfile makes this install web and parsing too.
      # `common` is named explicitly: --filter backend links the workspace
      # dependency but does not install the typescript that compiles it.
      - name: Install dependencies
        run: pnpm install --filter backend --filter common

      - name: Lint check
        run: pnpm lint-check

      # Builds `common` first, then `nest build`. vue-tsc's equivalent on web:
      # a type error fails the job rather than reaching the image.
      - name: Build Backend
        run: pnpm build

      - name: Test Backend
        run: pnpm exec vitest run
