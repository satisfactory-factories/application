name: Backend Checks

# Lint, compile and test. Runs on PRs, and is called by "Backend: Deploy" as the
# gate in front of the image build. The build step is the typecheck: `nest build`
# fails on a type error, the same way vue-tsc does for web.
#
# There is no `push: main` trigger any more: on main this is called by
# Backend Deploy instead, so keeping one would run the same checks twice on the
# same commit.
#
# The pull_request trigger cannot be path-filtered: this is a required status check
# and one that never triggers sits pending forever. It always triggers and the
# `changes` gate decides whether the real job runs (see changed-paths.yml). Under
# workflow_call the gate does not run at all, so a deploy is never gated.
on:
  pull_request:
    branches:
      - main
      # The v0.7.0 integration line: sync work lands here for beta testing first.
      - beta7
  workflow_call:
    inputs:
      # Absent on a plain pull_request trigger, which is how the gate below tells a
      # PR run from a deploy calling it. A deploy must never be gated out.
      called:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  changes:
    if: ${{ !inputs.called }}
    uses: ./.github/workflows/changed-paths.yml
    with:
      patterns: |
        backend/*
        common/*
        package.json
        pnpm-workspace.yaml
        pnpm-lock.yaml
        .github/workflows/build-backend.yml
        .github/workflows/changed-paths.yml

  build-backend:
    name: Build Backend
    needs: changes
    # `!cancelled()` because a skipped gate would otherwise skip this too.
    if: ${{ !cancelled() && (inputs.called || needs.changes.outputs.matched == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # corepack activates the pnpm pinned by `packageManager`, same as the API
      # image. `npm install -g pnpm` fetched latest and then delegated to the
      # pin anyway — two downloads, and an unpinned one in the build path.
      - name: Install pnpm
        run: corepack enable

      # --filter, or the shared lockfile makes this install web and parsing too.
      # `common` is named explicitly: --filter backend links the workspace
      # dependency but does not install the typescript that compiles it.
      - name: Install dependencies
        run: pnpm install --filter backend --filter common

      - name: Lint check
        run: pnpm lint-check

      # Nothing ran `common`'s own checks: its specs are excluded from
      # tsconfig.build.json, so `pnpm build` never saw them, and neither sibling suite
      # loads them. The zod schema in there is the whole data boundary. Checked in this
      # job because it is the one that already installs the package; `--filter` resolves
      # from the workspace root, so the backend working directory does not matter.
      - name: Lint check Common
        run: pnpm --filter common lint-check

      - name: Typecheck Common
        run: pnpm --filter common typecheck

      - name: Test Common
        run: pnpm --filter common exec vitest run

      # Builds `common` first, then `nest build`. vue-tsc's equivalent on web:
      # a type error fails the job rather than reaching the image.
      - name: Build Backend
        run: pnpm build

      - name: Test Backend
        run: pnpm exec vitest run
