name: Parsing Checks

# The push trigger stays path-filtered, the pull_request one does not. A required
# status check that never triggers sits pending forever rather than passing, so a
# path filter here would block every PR that does not touch parsing/.
on:
  push:
    branches:
      - main
    paths:
      - 'parsing/**'
  pull_request:
    branches:
      - main
      # The v0.7.0 integration line: sync work lands here for beta testing first.
      - beta7

permissions:
  contents: read

jobs:
  build-parsing:
    name: Build Parsing
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: parsing
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # corepack activates the pnpm pinned by `packageManager`, same as the API
      # image. `npm install -g pnpm` fetched latest and then delegated to the
      # pin anyway — two downloads, and an unpinned one in the build path.
      - name: Install pnpm
        run: corepack enable

      # --filter, or the shared lockfile makes this install web and backend too.
      - name: Install dependencies
        run: pnpm install --filter parsing

#      - name: Lint check
#        run: pnpm lint-check

      - name: Build Parsing
        run: pnpm build

      - name: Test Parsing
        run: pnpm test
