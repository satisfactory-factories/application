name: Web Checks

# The push trigger is path-filtered; the pull_request one cannot be, because this is
# a required status check and one that never triggers sits pending forever. So it
# always triggers and the `changes` gate decides whether the real job runs: see
# changed-paths.yml. A docs-only PR passes in seconds with the job skipped.
on:
  push:
    branches:
      - main
      # The v0.7.0 integration line: sync work lands here for beta testing first.
      - beta7
    paths:
      - 'web/**'
  pull_request:
    branches:
      - main
      - beta7
permissions:
  contents: read
jobs:
  changes:
    uses: ./.github/workflows/changed-paths.yml
    with:
      # The API is in here on purpose: web's e2e and typed client follow its shapes.
      patterns: |
        web/*
        backend/*
        common/*
        package.json
        pnpm-workspace.yaml
        pnpm-lock.yaml
        .github/workflows/build-web.yml
        .github/workflows/changed-paths.yml

  build-web:
    name: Build & Test Web
    needs: changes
    if: needs.changes.outputs.matched == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # corepack activates the pnpm pinned by `packageManager`, same as the API
      # image. `npm install -g pnpm` fetched latest and then delegated to the
      # pin anyway — two downloads, and an unpinned one in the build path.
      - name: Install pnpm
        run: corepack enable

      # --filter, or the shared lockfile makes this install backend and parsing too.
      - name: Install dependencies
        run: pnpm install --filter web...

      - name: Lint check
        run: pnpm lint-check

      - name: Build Web
        run: pnpm build

      - name: Test Web
        run: pnpm test