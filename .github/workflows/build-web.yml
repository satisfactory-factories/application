name: Web Checks

# The push trigger stays path-filtered, the pull_request one does not. A required
# status check that never triggers sits pending forever rather than passing, so a
# path filter here would block every PR that does not touch web/.
on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-web:
    name: Build & Test Web
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Lint check
        run: pnpm lint-check

      - name: Build Web
        run: pnpm build

      - name: Test Web
        run: pnpm test