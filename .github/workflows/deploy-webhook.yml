name: "Backend: Trigger Deployment Webhook"

# Reusable, and deliberately the last link in the chain. Pokes the webhooks
# server, which SSHes to the API box and redeploys it there.
#
#   POST <WEBHOOK_URL>   — the deploy hook on the webhooks host
#
# The hook is selected by the URL path; the body is only what the HMAC signature
# is computed over, so `application` is documentation rather than routing.
#
# Requires two repository secrets — see docs/deployment.md:
#   WEBHOOK_URL     the URL above
#   WEBHOOK_SECRET  the shared HMAC secret
on:
  workflow_call:
    inputs:
      # Which hook on the webhooks server to poke. Every hook there is the same
      # URL with a different last path segment, so the preview hook is derived
      # from WEBHOOK_URL rather than stored as a second secret — see the
      # derivation below, which refuses to run if that assumption stops holding.
      hook:
        description: 'Hook id to call (satisfactory-factories or satisfactory-factories-preview)'
        type: string
        required: false
        default: satisfactory-factories

permissions:
  contents: read

jobs:
  send-webhook:
    name: Trigger deployment
    runs-on: ubuntu-latest
    # Backstop only. --max-time below should resolve first.
    timeout-minutes: 5
    steps:
      # curl rather than an action. Every Actions wrapper for this leaves Node's
      # default agent in place, and since Node 19 https.globalAgent carries
      # timeout: 5000 — so the socket is killed at 5s no matter what timeout the
      # action was given, and the error still quotes the configured value. The
      # hook waits for the whole deploy, so that fired on every single run.
      - name: Trigger webhook
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          HOOK: ${{ inputs.hook }}
        run: |
          # WEBHOOK_URL is the production hook's full URL. Rebuild it from its own
          # base and the default hook id: if that does not reproduce the secret
          # byte for byte, this derivation is wrong and the preview URL would
          # point somewhere unintended, so stop rather than POST blind. The URL is
          # never echoed — this repo is public and the host is not.
          base="${WEBHOOK_URL%/*}"
          if [ "$base/satisfactory-factories" != "$WEBHOOK_URL" ]; then
            echo "::error::WEBHOOK_URL does not end in '/satisfactory-factories', so the hook URL cannot be derived. Fix the secret's shape or give the preview hook its own secret."
            exit 1
          fi
          url="$base/${HOOK}"

          body="{\"application\":\"${HOOK}\"}"
          signature=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" -r | cut -d' ' -f1)

          # The hook answers 200 or 500 carrying the deploy's own output, so this
          # step's result is the deploy's result — green here now does mean deployed.
          # 180s clears the ~100s at which the proxy in front gives up and returns a
          # 524, which at least says the deploy was still running.
          curl --fail-with-body --silent --show-error --max-time 180 \
            --header 'Content-Type: application/json' \
            --header "X-Hub-Signature-256: sha256=$signature" \
            --header "X-Hub-SHA: $GITHUB_SHA" \
            --data "$body" \
            "$url"
