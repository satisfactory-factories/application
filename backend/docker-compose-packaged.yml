# Runs the backend the way production runs it — from the image rather than from
# `pnpm dev` — against a local Mongo. For ordinary development use
# docker-compose.yml (Mongo only) plus `pnpm dev:backend`.
services:
  app:
    build:
      # The workspace root, because backend/package.json's `catalog:` versions
      # only resolve when pnpm-workspace.yaml is in the build context. See
      # backend/Dockerfile.
      context: ..
      dockerfile: backend/Dockerfile
    container_name: app
    networks:
      - backend
    env_file:
      - .env
    ports:
      - "3001:3001"
    volumes:
      # The app lives at /app/backend in the image now (the workspace root is
      # /app), so mounting over /app would hide it entirely. The anonymous
      # volumes keep the container's own node_modules and compiled dist rather
      # than letting the host's shadow them — the image runs node dist/main.js.
      - .:/app/backend
      - /app/backend/node_modules
      - /app/backend/dist
    command: pnpm start
  mongo:
    image: mongo:8.3.7
    container_name: sf-db
    ports:
      - "27017:27017"
    networks:
      - backend
    env_file:
      - .env
    volumes:
      - ./data:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js

networks:
  backend:
    name: backend