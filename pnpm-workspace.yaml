packages:
  - 'web'
  - 'backend'
  - 'parsing'

# Single source of truth for versions shared across all workspace packages.
# Reference these in a package.json with e.g. "typescript": "catalog:".
catalog:
  typescript: 6.0.3
  ts-node: 10.9.2
  '@eslint/js': 10.0.1
  eslint: 10.8.0
  eslint-import-resolver-typescript: 4.4.5
  eslint-plugin-import-x: 4.17.1
  typescript-eslint: 8.66.0

# Must stay true. Renovate only ever commits the workspace-root lockfile, so
# with per-package lockfiles every `catalog:` bump shipped as a one-file diff
# and broke the API image on ERR_PNPM_LOCKFILE_CONFIG_MISMATCH.
# See https://github.com/renovatebot/renovate/issues/37485
sharedWorkspaceLockfile: true

# pnpm 11 removed onlyBuiltDependencies in favour of this map, so the old list
# was dead config. @parcel/watcher (optional native watcher for sass) is left
# unbuilt, which is what the old list did in practice.
allowBuilds:
  core-js: true
  esbuild: true
  unrs-resolver: true
  vue-demi: true
  '@parcel/watcher': false

# js-yaml reaches us only through jest coverage tooling
# (babel-plugin-istanbul -> @istanbuljs/load-nyc-config), which asks for ^3.13.1 and
# would otherwise hold us on the v3-legacy line. This override is what lets us track
# the current major instead. The key stays ^3.13.1 because that is the range being
# matched, not the version being installed.
#
# This is a deliberate two-major substitution under a package that never declared it,
# so it is worth knowing what moved. load-nyc-config calls js-yaml load() on an nyc
# YAML config, and v5 changed that call: CORE_SCHEMA rather than DEFAULT_SCHEMA,
# !!set loads as a Set, numbers parse differently, and empty input throws instead of
# returning undefined. Nothing here exercises it -- no package has a .nycrc.yaml -- so
# the test suite cannot vouch for this either way. Adding one is what would expose it.
#
# Entries here are also exempt from the 14-day minimumReleaseAge guard in renovate.json:
# that governs what Renovate proposes, not what an override pins.
overrides:
  js-yaml@^3.13.1: 5.2.3
